  @media print {
    /* Letter paper with real margins */
    @page { size: letter; margin: 0.6in 0.6in 0.65in; }

    /* Hide all UI chrome */
    #app-header, #app-footer, #progress-bar, #nav-buttons, #print-buttons { display: none !important; }

    /* Reset page layout */
    html, body, #root > div { background: #fff !important; }
    #root > div { min-height: unset !important; }
    #app-main { padding: 0 !important; max-width: 100% !important; }

    /* Page break control */
    .print-page-break { page-break-before: always; break-before: page; }
    .print-no-break { page-break-inside: avoid; break-inside: avoid; }

    /* Compact cards for print */
    .print-card { box-shadow: none !important; border: 1px solid #D1D5DB !important; margin-bottom: 10px !important; padding: 12px 16px !important; }

    /* Force background colors to print */
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

    /* Hide Yes/No buttons and Start Over in SURE section */
    .sure-buttons { display: none !important; }

    /* Always show SURE tips in print */
    .sure-tip { display: block !important; }

    /* Hide score bar chart (not useful on paper) — keep table */
    .print-hide { display: none !important; }

    /* Tighten font sizes slightly */
    body { font-size: 12px; }

    /* Results page: print-only title line, flat cards, no clipping */
    .print-only { display: block !important; }
    .print-only-inline { display: inline !important; }
    .screen-only { display: none !important; }
    #results > div { box-shadow: none !important; }
    #results [style*="overflow"] { overflow: visible !important; }
    .print-keep-next { break-after: avoid; page-break-after: avoid; }
    #results table th:first-child, #results table td:first-child { width: 36%; }
    #results table td, #results table th { padding-top: 4px !important; padding-bottom: 4px !important; }
    .print-compact { padding: 14px 18px !important; margin-bottom: 12px !important; }
    .print-compact p { margin-bottom: 2px !important; }
    .print-strong-name { font-size: 19px !important; line-height: 1.3; }
    #results .print-legend { padding: 10px 14px !important; margin-bottom: 10px !important; }
    #results .print-legend p, #results .print-legend span { font-size: 12px !important; line-height: 1.4 !important; }
    #results .print-legend > p:first-child { margin-bottom: 6px !important; }
    #results .print-legend > div { margin-bottom: 3px !important; }
    #results .print-legend > p:last-child { margin-top: 6px !important; padding-top: 6px !important; }
    .print-strong-score { font-size: 26px !important; }
    #results .print-compact-note { padding: 10px 14px !important; margin-bottom: 10px !important; font-size: 12px !important; }

    /* Tables: keep rows whole, repeat headers if a table spans pages */
    thead { display: table-header-group; }
    tr, th, td { break-inside: avoid; page-break-inside: avoid; }

const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));

function App() {
  const [lang, setLang] = useState("en");
  const t = T[lang];
  const TOTAL = 10;
  const [step, setStep] = useState(0);
  const go = s => { setStep(clamp(s,0,TOTAL-1)); window.scrollTo({top:0,behavior:"smooth"}); };

  // Stage 1
  const [userOptions, setUserOptions] = useState([""]);
  const [reasonsText, setReasonsText] = useState("");
  const [timeline, setTimeline] = useState(null);
  const [province, setProvince] = useState(null);
  const [decisionStage, setDecisionStage] = useState(null);
  const [tenure, setTenure] = useState(null);
  const [tenureOther, setTenureOther] = useState("");
  const [disabilities, setDisabilities] = useState([]);
  const [condition, setCondition] = useState(null);
  const [progression, setProgression] = useState(null);
  const [intention, setIntention] = useState(null);
  const [ownerPerm, setOwnerPerm] = useState(null);
  const [involved, setInvolved] = useState([]);
  const [pressure, setPressure] = useState(null);
  const [forTwo, setForTwo] = useState(false);
  const [activePerson, setActivePerson] = useState(1);
  const [vals, setVals] = useState(Array(12).fill(0));
  const [p2Vals, setP2Vals] = useState(Array(12).fill(0));
  const [sure, setSure] = useState(Array(4).fill(null));
  const [p2Sure, setP2Sure] = useState(Array(4).fill(null));
  const [prosCons, setProsCons] = useState({});
  const setPC = (k,v) => setProsCons(p => ({...p,[k]:v}));

  // Stage 2
  const [ratings, setRatings] = useState({});
  const [rateIdx, setRateIdx] = useState(0);

  const toggleArr = (a,s,v) => s(a.includes(v)?a.filter(x=>x!==v):[...a,v]);
  const validOpts = userOptions.filter(Boolean);
  const derivedWeights = useMemo(() => vals.map(v => clamp(Math.round(v * 2), 0, 10)), [vals]);

  const calcScores = useCallback(ww => { const w=ww||derivedWeights; return validOpts.map((_,oi)=>{ let t=0; for(let fi=0;fi<12;fi++) t+=(w[fi]||0)*(ratings[`${oi}-${fi}`]||0); return t; }); },[validOpts,ratings,derivedWeights]);
  const scores = useMemo(()=>calcScores(),[calcScores]);
  /* A score of exactly 0 means "no different from staying put", so it must read
     neutral rather than green. Sign carries the meaning; colour reinforces it. */
  const scoreColor = s => (s > 0 ? C.pos : s < 0 ? C.neg : C.textLight);
  const scoreLabel = s => (s > 0 ? "+" : "") + s;
  /* Widest score this user's own weightings allow: 2 (max rating) x total weight. */
  const scoreRangeMax = useMemo(() => derivedWeights.reduce((a,b)=>a+b,0) * 2, [derivedWeights]);
  const bestIdx = useMemo(()=>{ let b=0; scores.forEach((s,i)=>{if(s>scores[b])b=i;}); return scores.length&&scores[b]>0?b:-1; },[scores]);
  const maxAbs = useMemo(()=>Math.max(1,...scores.map(Math.abs)),[scores]);
  /* All options that share the top score (only when it is above 0). More than one = a tie. */
  const topIdxs = useMemo(()=> bestIdx < 0 ? [] : scores.map((s,i)=>s===scores[bestIdx]?i:-1).filter(i=>i>=0), [scores,bestIdx]);
  const topValues = useMemo(()=>vals.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v).filter(x=>x.v>0).slice(0,5),[vals]);
  const sureYes = sure.filter(v=>v===true).length;

  // Rating completion tracking
  const optionCompletion = useMemo(() => {
    return validOpts.map((_, oi) => {
      let rated = 0;
      for (let fi = 0; fi < 12; fi++) { if (ratings[`${oi}-${fi}`] !== undefined) rated++; }
      return { rated, total: 12, complete: rated === 12 };
    });
  }, [validOpts, ratings]);
  const allOptionsRated = optionCompletion.every(o => o.complete);

  // UI
  const sH1={fontSize:26,fontWeight:700,color:C.text,lineHeight:1.3,marginBottom:8};
  const sPurpose={fontSize:15,color:C.textMid,lineHeight:1.6,marginBottom:24};
  const sCard={background:C.card,borderRadius:14,padding:"24px 28px",border:`1px solid ${C.borderLight}`,marginBottom:20,boxShadow:"0 1px 3px rgba(0,0,0,0.04)"};
  const sCardLabel={fontSize:16,fontWeight:600,color:C.text,marginBottom:12};
  const sPrimBtn={background:C.tealDark,color:C.white,border:"none",borderRadius:10,padding:"14px 36px",fontSize:16,fontWeight:600,cursor:"pointer"};
  const sSecBtn={background:"transparent",color:C.tealDark,border:`2px solid ${C.teal}`,borderRadius:10,padding:"12px 28px",fontSize:15,fontWeight:600,cursor:"pointer"};
  const sGoldBtn={background:"#956500",color:C.white,border:"none",borderRadius:10,padding:"14px 36px",fontSize:16,fontWeight:600,cursor:"pointer"};
  const sSel=(on)=>({padding:"11px 18px",borderRadius:10,border:`2px solid ${on?C.teal:C.border}`,background:on?C.tealLight:C.card,color:on?C.tealDark:C.text,cursor:"pointer",fontSize:15,transition:"all 0.15s",fontWeight:on?600:400,textAlign:"left",lineHeight:1.4,width:"100%",display:"block"});
  /* Chip style. `on` = selected/already-added (HAT blue tint).
     `used` = the chip can no longer be actioned, so it reads as a static
     state rather than an affordance. Colours are unchanged between states
     so contrast stays at the audited 6.52:1 / 9.37:1 — availability is
     signalled by the cursor and the checkmark, never by dimming. */
  const sTag=(on,used)=>({display:"inline-block",padding:"8px 16px",borderRadius:22,border:`1.5px solid ${on?C.teal:"#9CA3AF"}`,background:on?C.tealLight:"#F3F4F6",color:on?C.tealDark:C.textMid,cursor:used?"default":"pointer",fontSize:14,fontWeight:on?600:500,margin:"3px 4px",transition:"all 0.15s",fontFamily:"inherit",lineHeight:1.4,textAlign:"left"});
  const sInput={width:"100%",padding:"12px 16px",borderRadius:10,border:`1.5px solid ${C.border}`,fontSize:15,outline:"none",fontFamily:"inherit",resize:"vertical",boxSizing:"border-box"};
  const sSlider={width:"100%",accentColor:C.teal,height:6};

  /* Nav. When canNext is false the Continue button is genuinely blocked
     (not just dimmed) and nextHint explains what is still needed.
     aria-disabled rather than the disabled attribute keeps the button in the
     tab order so screen reader users can find it and hear why it won't act.
     The inactive style is a grey fill, not reduced opacity, so the label
     stays at 7.0:1 contrast instead of fading below AA. */
  const Nav=({canNext=true,onNext,nextLabel,nextHint})=>{
    const blocked=!canNext;
    const hintId="nav-hint-"+step;
    return(<div id="nav-buttons" style={{marginTop:32}}>
      {blocked&&nextHint&&<p id={hintId} role="status" style={{background:C.goldLight,border:`1px solid ${C.borderLight}`,borderLeft:`4px solid ${C.gold}`,borderRadius:8,padding:"10px 14px",fontSize:14,color:C.goldText,fontWeight:600,lineHeight:1.5,marginBottom:14}}>{nextHint}</p>}
      <div style={{display:"flex",justifyContent:"space-between",gap:12}}>
        {step>0?<button type="button" onClick={()=>go(step-1)} style={sSecBtn}>{t.back}</button>:<div/>}
        {step<TOTAL-1&&<button type="button" onClick={()=>{if(blocked)return;if(onNext)onNext();go(step+1);}} aria-disabled={blocked} aria-describedby={blocked&&nextHint?hintId:undefined} style={blocked?{...sPrimBtn,background:"#E5E7EB",color:C.textLight,cursor:"not-allowed"}:sPrimBtn}>{nextLabel||t.next}</button>}
      </div>
    </div>);
  };
  const PersonTabs=()=>forTwo?(<div style={{display:"flex",gap:8,marginBottom:20}}>{[1,2].map(p=>(<button key={p} onClick={()=>setActivePerson(p)} style={{flex:1,padding:"10px 0",borderRadius:10,border:`2px solid ${activePerson===p?C.teal:C.border}`,background:activePerson===p?C.teal:C.card,color:activePerson===p?C.white:C.text,cursor:"pointer",fontWeight:600,fontSize:14}}>{p===1?t.person1:t.person2}</button>))}</div>):null;
  const Progress=()=>{const sl=step===0?"":step<=5?t.stage1:t.stage2;const pct=step===0?0:(step/(TOTAL-1))*100;return step===0?null:(<div id="progress-bar" style={{marginBottom:32}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:12,fontWeight:700,color:C.tealDark,textTransform:"uppercase",letterSpacing:1.2}}>{sl}</span><span style={{fontSize:12,color:C.textLight}}>{t.step} {step} {t.of} {TOTAL-1}</span></div><div style={{height:5,background:C.borderLight,borderRadius:3}}><div style={{height:"100%",width:`${pct}%`,background:`linear-gradient(90deg,${C.tealDark},${C.teal})`,borderRadius:3,transition:"width 0.4s"}}/></div></div>);};
  const CatHeader=({label})=>(<div style={{fontSize:13,fontWeight:700,color:C.tealDark,textTransform:"uppercase",letterSpacing:1,marginBottom:14,paddingBottom:6,borderBottom:`2px solid ${C.tealLight}`}}>{label}</div>);
  const SRow=({label,value})=>value?(<div style={{marginBottom:14}}><p style={{fontSize:12,fontWeight:700,color:C.textLight,textTransform:"uppercase",letterSpacing:0.5,marginBottom:3}}>{label}</p><p style={{fontSize:15,color:C.text,whiteSpace:"pre-line"}}>{value}</p></div>):null;

  /* ─── SCREENS ─────────────────────────────────────────────────────── */

  /* ══════════════════════════════════════════════════════════════════
     HAT Decision Aid — landing page (first screen users see).
     Mirrors the HAT website/print branding: logo, blue title banner,
     left-accent-bar callout cards, grey footer rule.
     ══════════════════════════════════════════════════════════════════ */

  /* Left-accent callout card, matching the HAT print/document treatment */
  const Callout = ({icon, title, accent, fill, titleColor, children}) => (
    <div style={{display:"flex", marginBottom:18, borderRadius:10, overflow:"hidden",
                 border:`1px solid ${C.borderLight}`, background:fill}}>
      <div aria-hidden="true" style={{width:6, background:accent, flexShrink:0}}/>
      <div style={{padding:"14px 18px"}}>
        <p style={{fontWeight:700, fontSize:15, color:titleColor, marginBottom:6}}>
          <span aria-hidden="true">{icon}</span>{"  "}{title}
        </p>
        {children}
      </div>
    </div>
  );

  const Welcome = () => (
    <div style={{maxWidth:660, margin:"0 auto"}}>

      {/* Logo */}
      <div style={{textAlign:"center", marginBottom:18}}>
        <img src={HAT_LOGO}
             alt="Home Accessibility Toolkit Decision Aid"
             style={{width:"100%", maxWidth:260, height:"auto", display:"inline-block"}}/>
      </div>

      {/* Blue title banner */}
      <h1 style={{background:C.tealDark, color:C.white, fontSize:26, fontWeight:700,
                  lineHeight:1.3, padding:"16px 22px", borderRadius:10, marginBottom:16}}>
        {t.title} {t.subtitle}
      </h1>

      {/* Tagline */}
      <p style={{fontStyle:"italic", fontSize:16, color:C.textMid,
                 lineHeight:1.6, marginBottom:20}}>
        {t.landTagline}
      </p>

      {/* How it works */}
      <h2 style={{fontSize:20, fontWeight:700, color:C.text,
                  marginTop:26, marginBottom:12}}>{t.landHowTitle}</h2>
      <ul style={{listStyle:"none", margin:"0 0 22px", padding:0}}>
        {t.landHowSteps.map(([lead, rest], i) => (
          <li key={i} style={{display:"flex", gap:10, marginBottom:9, alignItems:"flex-start"}}>
            <span aria-hidden="true" style={{color:C.tealDark, fontWeight:700,
                                             lineHeight:1.55, flexShrink:0}}>{"\u2022"}</span>
            <span style={{fontSize:15, color:C.text, lineHeight:1.55}}>
              <strong>{lead}</strong> {rest}
            </span>
          </li>
        ))}
      </ul>

      {/* Before you start — includes the privacy note */}
      <Callout icon={"\u26A0\uFE0F"} title={t.landBeforeTitle}
               accent={C.gold} fill={C.goldLight} titleColor={C.goldText}>
        <p style={{fontSize:15, color:C.text, lineHeight:1.6, marginBottom:10}}>{t.landBeforeBody}</p>

      <p style={{fontSize:15, fontWeight:700, color:C.text, marginBottom:3}}>{t.landSource2Name}</p>

                 marginBottom:18}}>{t.landSource2Cite}</p>

      <div style={{borderTop:`1px solid ${C.border}`, paddingTop:10, marginTop:6}}>
        <p style={{fontSize:12, color:C.textLight, lineHeight:1.6}}>
          {t.title}{"  |  "}{t.subtitle}{"  |  "}homeaccessibilitytoolkit.ca
        </p>
        <p style={{fontSize:12, color:C.textLight, fontStyle:"italic", lineHeight:1.6}}>
          {t.landDisclaimer}
        </p>
      </div>
    </div>
  );

  // 1 — Options & Context (OPTIONS FIRST)
  const S1_1=()=>(<div>
    <h2 style={sH1}>{t.s1_1_title}</h2><p style={sPurpose}>{t.s1_1_purpose}</p>
    <div style={sCard}>
      {userOptions.map((opt,i)=>(<div key={i} style={{display:"flex",gap:10,marginBottom:10,alignItems:"center"}}><span style={{fontWeight:700,color:C.tealDark,fontSize:16,minWidth:24}}>{i+1}.</span><input value={opt} onChange={e=>{const n=[...userOptions];n[i]=e.target.value;setUserOptions(n);}} placeholder={t.optionPh} style={{...sInput,flex:1,width:"auto"}}/>{userOptions.length>1&&<button onClick={()=>setUserOptions(userOptions.filter((_,j)=>j!==i))} style={{background:"none",border:"none",color:C.neg,fontSize:22,cursor:"pointer"}}>×</button>}</div>))}
      {userOptions.length<4&&<button onClick={()=>setUserOptions([...userOptions,""])} style={{...sSecBtn,width:"100%",marginTop:4,textAlign:"center",fontSize:14,padding:"10px 0"}}>{t.addOption}</button>}
      <div style={{marginTop:14}}><p style={{fontSize:13,color:C.textLight,marginBottom:6}}>{t.commonOpts}</p><div style={{display:"flex",flexWrap:"wrap",gap:4}}>{t.suggestions.map((s,i)=>{const chosen=userOptions.some(o=>o.trim()===s);const noRoom=!chosen&&!userOptions.some(o=>!o.trim())&&userOptions.length>=4;const locked=chosen||noRoom;return(<button type="button" key={i} aria-pressed={chosen} aria-disabled={locked} onClick={()=>{if(locked)return;const idx=userOptions.findIndex(o=>!o.trim());if(idx>=0){const n=[...userOptions];n[idx]=s;setUserOptions(n);}else if(userOptions.length<4)setUserOptions([...userOptions,s]);}} style={sTag(chosen,locked)}>{chosen?"\u2713 ":""}{s}</button>);})}</div></div>
    </div>
    <div style={sCard}><p style={sCardLabel}>{t.reasonsQ}</p><textarea value={reasonsText} onChange={e=>setReasonsText(e.target.value)} placeholder={t.reasonsPh} rows={3} style={sInput}/><div style={{marginTop:10}}><p style={{fontSize:13,color:C.textLight,marginBottom:6}}>{t.commonReasons}</p><div style={{display:"flex",flexWrap:"wrap",gap:5}}>{t.reasonSuggestions.map((s,i)=>{const chosen=reasonsText.includes(s);return(<button type="button" key={i} aria-pressed={chosen} aria-disabled={chosen} onClick={()=>{if(chosen)return;setReasonsText(p=>p?p+"; "+s:s);}} style={sTag(chosen,chosen)}>{chosen?"\u2713 ":""}{s}</button>);})}</div></div></div>
    <div style={sCard}><p style={sCardLabel}>{t.timelineQ}</p><div style={{display:"flex",flexDirection:"column",gap:8}}>{t.timelines.map((tl,i)=><button key={i} onClick={()=>setTimeline(i)} style={sSel(timeline===i)}>{tl}</button>)}</div></div>
    <div style={sCard}><p style={sCardLabel}>{t.provinceQ}</p><div style={{display:"flex",flexWrap:"wrap",gap:6}}>{PK.map((pk,i)=><button type="button" key={pk} aria-pressed={province===pk} onClick={()=>setProvince(pk)} style={sTag(province===pk)}>{t.provinces[i]}</button>)}</div></div>
    <div style={sCard}><p style={sCardLabel}>{t.stageQ}</p><div style={{display:"flex",flexDirection:"column",gap:8}}>{t.stages.map((s,i)=><button key={i} onClick={()=>setDecisionStage(i)} style={sSel(decisionStage===i)}>{s}</button>)}</div></div>
    <Nav canNext={userOptions.some(o=>o.trim())} nextHint={t.navNeedOption}/>
  </div>);

  // 2 — Disability & Tenure
  const S1_2=()=>(<div>
    <h2 style={sH1}>{t.s1_2_title}</h2><p style={sPurpose}>{t.s1_2_purpose}</p>
    <div style={sCard}><p style={sCardLabel}>{t.tenureQ}</p><div style={{display:"flex",flexDirection:"column",gap:8}}>{t.tenures.map((v,i)=><button key={i} onClick={()=>setTenure(i)} style={sSel(tenure===i)}>{v}</button>)}</div>{tenure===4&&<input value={tenureOther} onChange={e=>setTenureOther(e.target.value)} placeholder={lang==="en"?"Please describe your housing situation":"Veuillez décrire votre situation de logement"} style={{...sInput,marginTop:12}}/> }</div>
    <div style={sCard}><p style={sCardLabel}>{t.disabilityQ}</p><p style={{fontSize:13,color:C.textLight,marginBottom:10}}>{t.disabilityNote}</p><div style={{display:"flex",flexDirection:"column",gap:8}}>{t.disabilities.map((d,i)=><button key={i} onClick={()=>toggleArr(disabilities,setDisabilities,i)} style={sSel(disabilities.includes(i))}>{d}</button>)}</div></div>
    {!disabilities.includes(3)&&disabilities.length>0&&(<>
      <div style={sCard}><p style={sCardLabel}>{t.conditionQ}</p><div style={{display:"flex",flexDirection:"column",gap:8}}>{t.conditionOpts.map((c,i)=><button key={i} onClick={()=>setCondition(i)} style={sSel(condition===i)}>{c}</button>)}</div></div>
      <div style={sCard}><p style={sCardLabel}>{t.progressionQ}</p><div style={{display:"flex",flexDirection:"column",gap:8}}>{t.progressions.map((p,i)=><button key={i} onClick={()=>setProgression(i)} style={sSel(progression===i)}>{p}</button>)}</div></div>
    </>)}
    <div style={sCard}><p style={sCardLabel}>{t.intentionQ}</p><div style={{display:"flex",flexDirection:"column",gap:8}}>{t.intentions.map((v,i)=><button key={i} onClick={()=>setIntention(i)} style={sSel(intention===i)}>{v}</button>)}</div></div>
    {tenure!==null&&tenure!==0&&tenure!==4&&(<div style={sCard}><p style={sCardLabel}>{t.ownerPermQ}</p><div style={{display:"flex",flexDirection:"column",gap:8}}>{t.ownerPerms.map((v,i)=><button key={i} onClick={()=>setOwnerPerm(i)} style={sSel(ownerPerm===i)}>{v}</button>)}</div></div>)}
    <Nav/>
  </div>);

  // 3 — Who's Involved
  const S1_3=()=>(<div>
    <h2 style={sH1}>{t.s1_3_title}</h2><p style={sPurpose}>{t.s1_3_purpose}</p>
    <div style={sCard}><p style={sCardLabel}>{t.involvedQ}</p><div style={{display:"flex",flexDirection:"column",gap:8}}>{t.involved.map((v,i)=><button key={i} onClick={()=>toggleArr(involved,setInvolved,i)} style={sSel(involved.includes(i))}>{v}</button>)}</div></div>
    <div style={sCard}><p style={sCardLabel}>{t.pressureQ}</p><div style={{display:"flex",flexDirection:"column",gap:8}}>{t.pressures.map((p,i)=><button key={i} onClick={()=>setPressure(i)} style={sSel(pressure===i)}>{p}</button>)}</div>{(pressure===0||pressure===1)&&<div style={{marginTop:12,background:C.goldLight,borderRadius:10,padding:"14px 18px"}}><p style={{fontWeight:600,color:C.goldText,fontSize:14,marginBottom:4}}>{"💡 "}{t.pressureFollowup}</p></div>}</div>
    <div style={sCard}><p style={sCardLabel}>{t.forTwoQ}</p><p style={{fontSize:14,color:C.textLight,marginBottom:12}}>{t.forTwoDesc}</p><div style={{display:"flex",gap:10}}><button onClick={()=>setForTwo(true)} style={{...sSel(forTwo),flex:1,textAlign:"center"}}>{t.forTwoYes}</button><button onClick={()=>setForTwo(false)} style={{...sSel(!forTwo),flex:1,textAlign:"center"}}>{t.forTwoNo}</button></div></div>
    <Nav/>
  </div>);

  // 4 — Values
  const catR=[[0,4],[4,8],[8,10],[10,12]];
  const catN=[t.catConnections,t.catMoney,t.catHome,t.catFuture];
  const S1_4=()=>{const src=activePerson===2?p2Vals:vals;const setSrc=activePerson===2?setP2Vals:setVals;const upd=(i,v)=>{const n=[...src];n[i]=Number(v);setSrc(n);};return(<div><h2 style={sH1}>{t.s1_4_title}</h2><p style={sPurpose}>{t.s1_4_purpose}</p><PersonTabs/>{catN.map((cat,ci)=>(<div key={ci} style={sCard}><CatHeader label={cat}/>{t.values.slice(catR[ci][0],catR[ci][1]).map((v,vi)=>{const idx=catR[ci][0]+vi;return(<div key={idx} style={{marginBottom:22}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:6}}><span style={{fontSize:15}}>{v}</span><span style={{fontWeight:700,color:C.tealDark,fontSize:20,minWidth:28,textAlign:"right"}}>{src[idx]}</span></div><input type="range" min="0" max="5" value={src[idx]} onChange={e=>upd(idx,e.target.value)} style={sSlider}/><div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:11,color:C.textLight}}>{t.notImportant}</span><span style={{fontSize:11,color:C.textLight}}>{t.veryImportant}</span></div></div>);})}</div>))}<Nav canNext={vals.some(v=>v>0)&&(!forTwo||p2Vals.some(v=>v>0))} nextHint={forTwo?t.navNeedValuesBoth:t.navNeedValues}/></div>);};

  // 5 — Pros & Cons (after Values, before SURE)
  const S2_0 = () => (
    <div>
      <h2 style={sH1}>{t.s2_0_title}</h2>
      <p style={sPurpose}>{t.s2_0_purpose}</p>
      {validOpts.map((opt, i) => (
        <div key={i} style={{...sCard, borderLeft: `4px solid ${C.teal}`}}>
          <p style={{fontWeight: 700, fontSize: 18, color: C.tealDark, marginBottom: 14}}>{i + 1}. {opt}</p>
          <div style={{marginBottom: 16}}>
            <p style={{fontSize: 14, fontWeight: 600, color: C.pos, marginBottom: 6}}>{"✓ "}{t.prosLabel}</p>
            <textarea value={prosCons[`${i}-pros`] || ""} onChange={e => setPC(`${i}-pros`, e.target.value)} placeholder={t.prosPh} rows={3} style={sInput} />
          </div>
          <div>
            <p style={{fontSize: 14, fontWeight: 600, color: C.neg, marginBottom: 6}}>{"✗ "}{t.consLabel}</p>
            <textarea value={prosCons[`${i}-cons`] || ""} onChange={e => setPC(`${i}-cons`, e.target.value)} placeholder={t.consPh} rows={3} style={sInput} />
          </div>
        </div>
      ))}
      <div style={{...sCard, borderLeft: `4px solid ${C.gold}`, background: C.goldLight}}>
        <p style={{fontWeight: 700, fontSize: 16, color: C.goldText, marginBottom: 14}}>{"⚓ "}{t.alsoConsider}</p>
        <div style={{marginBottom: 16}}>
          <p style={{fontSize: 14, fontWeight: 600, color: C.pos, marginBottom: 6}}>{"✓ "}{t.stayProsLabel}</p>
          <textarea value={prosCons["stay-pros"] || ""} onChange={e => setPC("stay-pros", e.target.value)} placeholder={t.prosPh} rows={3} style={{...sInput, background: C.white}} />
        </div>
        <div>
          <p style={{fontSize: 14, fontWeight: 600, color: C.neg, marginBottom: 6}}>{"✗ "}{t.stayConsLabel}</p>
          <textarea value={prosCons["stay-cons"] || ""} onChange={e => setPC("stay-cons", e.target.value)} placeholder={t.consPh} rows={3} style={{...sInput, background: C.white}} />
        </div>
      </div>
      <Nav />
    </div>
  );

  // 6 — SURE
  const S1_5 = () => {
    const src = activePerson === 2 ? p2Sure : sure;
    const setSrc = activePerson === 2 ? setP2Sure : setSure;
    const yN = src.filter(v => v === true).length;
    const done = src.every(v => v !== null);
    const msg = yN >= 4 ? t.sureGood : yN >= 2 ? t.sureMid : t.sureLow;
    const msgBg = yN >= 4 ? C.posLight : yN >= 2 ? C.goldLight : C.negLight;
    const msgBdr = yN >= 4 ? C.pos : yN >= 2 ? C.gold : C.neg;
    return (
      <div>
        <h2 style={sH1}>{t.s1_5_title}</h2>
        <p style={sPurpose}>{t.s1_5_purpose}</p>
        <PersonTabs />
        {t.sureQs.map((q, qi) => (
          <div key={qi} style={sCard}>
            <p style={sCardLabel}>{q}</p>
            <div style={{display: "flex", gap: 10, marginBottom: 8}}>
              <button onClick={() => { const n = [...src]; n[qi] = true; setSrc(n); }} style={{...sSel(src[qi] === true), flex: 1, textAlign: "center"}}>{t.yes}</button>
              <button onClick={() => { const n = [...src]; n[qi] = false; setSrc(n); }} style={{...sSel(src[qi] === false), flex: 1, textAlign: "center"}}>{t.no}</button>
            </div>
            {src[qi] === false && (
              <div style={{marginTop: 12, background: C.goldLight, borderRadius: 10, padding: "14px 18px"}}>
                <p style={{fontWeight: 600, color: C.goldText, fontSize: 14, marginBottom: 8}}>{"💡 "}{t.sureHelp[qi].title}</p>
                {t.sureHelp[qi].tips.map((tip, ti) => (
                  <div key={ti} style={{display: "flex", gap: 8, marginBottom: 6}}>
                    <span style={{color: C.goldText, fontSize: 12, marginTop: 2}}>{"▸"}</span>
                    <span style={{fontSize: 14, color: C.textMid, lineHeight: 1.5}}>{tip}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        ))}
        {done && (
          <div style={{...sCard, background: msgBg, borderLeft: `4px solid ${msgBdr}`}}>
            <p style={{fontWeight: 600, color: C.text, fontSize: 16}}>{msg}</p>
          </div>
        )}
        <Nav />
      </div>
    );
  };

  // Reusable pros/cons summary card
  const hasPC = validOpts.some((_, i) => prosCons[`${i}-pros`] || prosCons[`${i}-cons`]) || prosCons["stay-pros"] || prosCons["stay-cons"];
  const PCCard = () => {
    if (!hasPC) return null;
    return (
      <div style={sCard}>
        <p style={{fontSize: 12, fontWeight: 700, color: C.textLight, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 10}}>{t.prosConsReview}</p>
        {validOpts.map((opt, i) => (prosCons[`${i}-pros`] || prosCons[`${i}-cons`]) ? (
          <div key={i} style={{marginBottom: 12, padding: "10px 14px", background: C.bg, borderRadius: 8}}>
            <p style={{fontWeight: 600, color: C.tealDark, marginBottom: 4, fontSize: 14}}>{opt}</p>
            {prosCons[`${i}-pros`] && <p style={{fontSize: 13, marginBottom: 2}}><span style={{color: C.pos, fontWeight: 600}}>{"✓ "}</span>{prosCons[`${i}-pros`]}</p>}
            {prosCons[`${i}-cons`] && <p style={{fontSize: 13}}><span style={{color: C.neg, fontWeight: 600}}>{"✗ "}</span>{prosCons[`${i}-cons`]}</p>}
          </div>

        {(prosCons["stay-pros"] || prosCons["stay-cons"]) && (
          <div style={{padding: "10px 14px", background: C.goldLight, borderRadius: 8}}>
            <p style={{fontWeight: 600, color: C.goldText, marginBottom: 4, fontSize: 14}}>{t.stayAsIs}</p>
            {prosCons["stay-pros"] && <p style={{fontSize: 13, marginBottom: 2}}><span style={{color: C.pos, fontWeight: 600}}>{"✓ "}</span>{prosCons["stay-pros"]}</p>}
            {prosCons["stay-cons"] && <p style={{fontSize: 13}}><span style={{color: C.neg, fontWeight: 600}}>{"✗ "}</span>{prosCons["stay-cons"]}</p>}
          </div>
        )}
      </div>
    );
  };

  // 7 — OPDG Summary (includes pros/cons)
  const S1_6 = () => {
    const ri = sureYes >= 4 ? 2 : sureYes >= 2 ? 1 : 0;
    return (
      <div>
        <h2 style={sH1}>{t.s1_6_title}</h2>
        <p style={sPurpose}>{t.s1_6_purpose}</p>

          <SRow label={t.summaryPressure} value={pressure !== null ? t.pressures[pressure] : "\u2014"} />
        </div>
        {topValues.length > 0 && (
          <div style={sCard}>
            <p style={{fontSize: 12, fontWeight: 700, color: C.textLight, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 10}}>{t.summaryTopValues}</p>

                <span style={{fontSize: 14}}>{t.values[idx]}</span>

          </div>

        <div style={sCard}>
          <SRow label={t.summaryReadiness} value={decisionStage !== null ? t.stages[decisionStage] : t.notAnswered} />

        </div>
        <Nav nextLabel={t.continueToCompare} />
      </div>
    );
  };

  // 8 — Rate Options
  const S2_2 = () => {
    const opt = validOpts[rateIdx];
    if (!opt && validOpts.length > 0) { setRateIdx(0); return null; }
    const setR = (fi, s) => setRatings({...ratings, [`${rateIdx}-${fi}`]: s});
    const comp = optionCompletion[rateIdx] || {rated: 0, total: 12, complete: false};
    const remaining = comp.total - comp.rated;
    return (
      <div>
        <h2 style={sH1}>{t.s2_2_title}</h2>
        <div style={{display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap"}}>
          {validOpts.map((o, i) => {
            const oc = optionCompletion[i] || {rated: 0, total: 12, complete: false};
            return (
              <button key={i} onClick={() => { setRateIdx(i); window.scrollTo({top: 0, behavior: "smooth"}); }}
                style={{padding: "10px 18px", borderRadius: 10,
                  border: `2px solid ${rateIdx === i ? C.gold : oc.complete ? C.pos : C.border}`,
                  background: rateIdx === i ? C.goldLight : oc.complete ? C.posLight : C.card,
                  color: rateIdx === i ? C.text : oc.complete ? C.pos : C.textLight,
                  cursor: "pointer", fontWeight: rateIdx === i ? 700 : 400, fontSize: 14}}>
                {oc.complete && <span style={{marginRight: 6}}>{"✓"}</span>}{i + 1}. {o}
                {!oc.complete && <span style={{display: "block", fontSize: 11, color: C.textLight, marginTop: 2}}>{oc.total - oc.rated} {t.rateIncomplete}</span>}
              </button>
            );
          })}
        </div>
        <div style={{...sCard, background: C.goldLight, borderLeft: `4px solid ${C.gold}`}}>
          <p style={{fontWeight: 700, fontSize: 18, color: C.text}}>{"⚓ "}{t.ratingInstruction} <span style={{color: C.tealDark}}>{opt}</span></p>
          <p style={{background: C.white, border: `2px solid ${C.gold}`, borderRadius: 10, padding: "14px 18px", marginTop: 12, fontSize: 17, fontWeight: 700, color: C.text, lineHeight: 1.5}}>{t.ratingCompare}</p>
        </div>
        {t.factors.map((f, fi) => {
          const cur = ratings[`${rateIdx}-${fi}`];
          return (
            <div key={fi} style={{...sCard, padding: "18px 22px"}}>
              <p style={{fontSize: 15, fontWeight: 500, marginBottom: 6}}>{f}</p>
              <div style={{display: "flex", gap: 5, flexWrap: "wrap"}}>
                {t.ratings.map((label, ri) => {
                  const sc = t.ratingScores[ri];
                  const on = cur === sc;
                  const btnBg = on ? (sc < 0 ? C.neg : sc > 0 ? C.pos : C.textLight) : C.card;
                  return (
                    <button key={ri} onClick={() => setR(fi, sc)}
                      style={{flex: "1 1 0", padding: "9px 6px", borderRadius: 8,
                        border: `1.5px solid ${on ? btnBg : C.border}`,
                        background: on ? btnBg : C.card,
                        color: on ? C.white : C.text,
                        fontSize: 13, cursor: "pointer", fontWeight: on ? 600 : 400, minWidth: 60}}>
                      {label}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        })}
        <div style={{...sCard, background: comp.complete ? C.posLight : C.goldLight, borderLeft: `4px solid ${comp.complete ? C.pos : C.gold}`, textAlign: "center"}}>
          <p style={{fontWeight: 600, fontSize: 15, color: comp.complete ? C.pos : C.goldText}}>
            {comp.complete ? t.rateComplete : `${remaining} ${t.rateIncomplete}`}
          </p>
        </div>
        <div style={{display: "flex", justifyContent: "space-between", marginTop: 16, gap: 12, flexWrap: "wrap"}}>
          {rateIdx > 0 && (
            <button onClick={() => { setRateIdx(rateIdx - 1); window.scrollTo({top: 0, behavior: "smooth"}); }} style={sSecBtn}>
              {t.ratePrevOption} {validOpts[rateIdx - 1]}
            </button>
          )}
          {rateIdx < validOpts.length - 1 && (
            <button onClick={() => { setRateIdx(rateIdx + 1); window.scrollTo({top: 0, behavior: "smooth"}); }} style={{...sGoldBtn, marginLeft: "auto"}}>
              {t.rateNextOption} {validOpts[rateIdx + 1]} {"\u2192"}
            </button>
          )}
        </div>
        {allOptionsRated ? (
          <div style={{marginTop: 20}}><Nav /></div>
        ) : (
          <div style={{...sCard, background: C.goldLight, textAlign: "center", marginTop: 20}}>
            <p style={{fontSize: 14, color: C.goldText, fontWeight: 600}}>{t.rateAllPrompt}</p>
            <p style={{fontSize: 13, color: C.textLight, marginTop: 6}}>
              {validOpts.map((o, i) => { const oc = optionCompletion[i]; return oc && oc.complete ? `\u2713 ${o}` : `\u25CB ${o}`; }).join("  \u00B7  ")}
            </p>
          </div>
        )}
      </div>
    );
  };

  // 9 — Review
  const S2_3 = () => (
    <div>
      <h2 style={sH1}>{t.s2_3_title}</h2>
      <p style={sPurpose}>{t.s2_3_purpose}</p>
      <div style={sCard}>
        <p style={{fontSize: 13, color: C.textLight, fontWeight: 600, marginBottom: 4}}>{t.reviewBaseline}</p>
        <p style={{fontSize: 13, color: C.textLight, fontWeight: 600, marginBottom: 8, marginTop: 12}}>{t.reviewOptions}</p>
        {validOpts.map((o, i) => (
          <div key={i} style={{display: "flex", gap: 8, alignItems: "center", marginBottom: 6}}>
            <span style={{width: 24, height: 24, borderRadius: "50%", background: C.teal, color: C.white, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: 12}}>{i + 1}</span>
            <span style={{fontSize: 15}}>{o}</span>
          </div>
        ))}
      </div>
      {topValues.length > 0 && (
        <div style={sCard}>
          <p style={{fontSize: 13, color: C.textLight, fontWeight: 600, marginBottom: 8}}>{t.reviewTopValues}</p>
          {topValues.map(({v, i: idx}) => (
            <div key={idx} style={{display: "flex", justifyContent: "space-between", padding: "4px 0"}}>
              <span style={{fontSize: 14}}>{t.values[idx]}</span>
              <span style={{fontWeight: 700, color: C.teal}}>{v}/5</span>
            </div>
          ))}
        </div>
      )}
      <div style={{textAlign: "center", marginTop: 24}}>
        <p style={{fontWeight: 600, fontSize: 16, marginBottom: 16}}>{t.reviewReady}</p>
        <div style={{display: "flex", gap: 12, justifyContent: "center", flexWrap: "wrap"}}>
          <button onClick={() => go(1)} style={sSecBtn}>{t.goBackEdit}</button>
          <button onClick={() => go(9)} style={sGoldBtn}>{t.seeResults}</button>
        </div>
      </div>
    </div>
  );

  /* Funding preview — one block per category, program names link out to the
     administering organization. No hooks: S2_4 is invoked imperatively. */
  const FundingGroup = ({heading, items, compact}) => {
    const tr = str => (lang === "fr" && FUNDING_FR[str]) || str;
    const order = ["prov","terr","city","gds","ins","npo","cond","ftax","fgrant","other"];
    const seen = order.filter(k => items.some(p => p.s === k));
    return (
      <div style={{marginBottom: 18}}>
        <p style={{fontWeight: 700, fontSize: 15, color: C.tealDark, background: C.tealLight, borderRadius: 8, padding: "8px 14px", marginBottom: 10}}>{heading}</p>
        {seen.map(key => (
          <div key={key} style={{marginBottom: compact ? 10 : 14}}>
            <p style={{fontSize: 13, fontWeight: 700, color: C.textMid, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6}}>{t.fundingSections[key]}</p>
            {items.filter(p => p.s === key).map((p, n) => (
              compact ? (
                <p key={n} style={{fontSize: 14, lineHeight: 1.45, marginBottom: 5, paddingLeft: 12, borderLeft: `3px solid ${C.borderLight}`}}>
                  <span style={{fontWeight: 600}}>{p.u ? <a href={p.u} target="_blank" rel="noopener noreferrer" style={{color: C.tealDark, textDecoration: "underline"}}>{p.p}</a> : p.p}</span>
                  {p.t && <span style={{color: C.textLight, fontSize: 13}}>{" \u2014 "}{tr(p.t)}</span>}
                </p>
              ) : (
                <div key={n} style={{borderLeft: `3px solid ${C.borderLight}`, paddingLeft: 12, marginBottom: 10}}>
                  <p style={{fontSize: 14, fontWeight: 600, lineHeight: 1.4}}>
                    {p.u ? <a href={p.u} target="_blank" rel="noopener noreferrer" style={{color: C.tealDark, textDecoration: "underline"}}>{p.p}</a> : p.p}
                  </p>
                  <p style={{fontSize: 13, color: C.text, lineHeight: 1.45, marginTop: 2}}>{tr(p.a)}</p>
                  {p.t && <p style={{fontSize: 12, color: C.textLight, marginTop: 2}}>{tr(p.t)}</p>}
                </div>
              )
            ))}
          </div>
        ))}
      </div>
    );
  };

  // 10 — Results
  const S2_4 = () => {
    const funding = province ? FUNDING[province] : null;
    const maxBar = 180;
    const ri = sureYes >= 4 ? 2 : sureYes >= 2 ? 1 : 0;
    const sSection = {fontSize: 20, fontWeight: 700, color: C.tealDark, marginBottom: 4, marginTop: 36};
    const sSectionDesc = {fontSize: 14, color: C.textMid, marginBottom: 10, lineHeight: 1.5};
    const printDate = new Date().toLocaleDateString(lang === "en" ? "en-CA" : "fr-CA", {year: "numeric", month: "long", day: "numeric"});
    return (
      <div id="results">
        <p className="print-only" style={{fontSize: 12, fontWeight: 700, color: C.tealDark, textTransform: "uppercase", letterSpacing: 1, marginBottom: 4}}>
          {t.title} {"\u2014"} {t.subtitle} {"\u00B7"} {t.printedOn} {printDate}
        </p>
        <h2 style={sH1}>{t.s2_4_title}</h2>

        <div style={{...sCard, background: C.goldLight, borderLeft: `4px solid ${C.gold}`, fontSize: 13, color: C.textMid}}>
          {"\u26A0\uFE0F "}{t.disclaimer}
        </div>

        {/* ═══ PART 1: Qualitative / Self-Report Summary ═══ */}
        <div className="print-keep-next" style={{...sSection, marginTop: 24, borderBottom: `3px solid ${C.teal}`, paddingBottom: 8}}>{t.resultsPart1}</div>
        <p className="print-keep-next" style={sSectionDesc}>{t.resultsPart1Desc}</p>

        <div className="print-no-break" style={{...sCard, marginBottom: 8, padding: "14px 18px"}}>
          <SRow label={t.summaryOptions} value={validOpts.map((o, i) => `${i + 1}. ${o}`).join("\n") || "\u2014"} />
          <SRow label={t.summaryReasons} value={reasonsText || "\u2014"} />
          <SRow label={t.summaryTimeline} value={timeline !== null ? t.timelines[timeline] : null} />
          <SRow label={t.summaryProvince} value={province ? t.provinceFull[PK.indexOf(province)] : null} />
        </div>
        <div className="print-no-break" style={{...sCard, marginBottom: 8, padding: "14px 18px"}}>
          <SRow label={t.summaryTenure} value={tenure !== null ? (tenure === 4 && tenureOther ? `${t.tenures[4]}: ${tenureOther}` : t.tenures[tenure]) : null} />
          <SRow label={t.summaryDisability} value={disabilities.length ? disabilities.map(di => t.disabilities[di]).join("; ") : null} />
          {condition !== null && <SRow label={t.summaryDuration} value={t.conditionOpts[condition]} />}
          {progression !== null && <SRow label={lang === "en" ? "Condition progression" : "\u00c9volution"} value={t.progressions[progression]} />}
          <SRow label={t.summaryIntention} value={intention !== null ? t.intentions[intention] : null} />
          {ownerPerm !== null && <SRow label={t.summaryPermission} value={t.ownerPerms[ownerPerm]} />}
        </div>
        <div className="print-no-break" style={{...sCard, marginBottom: 8, padding: "14px 18px"}}>
          <SRow label={t.summaryInvolved} value={involved.length ? involved.map(ii => t.involved[ii]).join(", ") : "\u2014"} />
          <SRow label={t.summaryPressure} value={pressure !== null ? t.pressures[pressure] : "\u2014"} />
        </div>
        {topValues.length > 0 && (
          <div className="print-no-break" style={{...sCard, marginBottom: 8, padding: "14px 18px"}}>
            <p style={{fontSize: 12, fontWeight: 700, color: C.textLight, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 10}}>{t.summaryTopValues}</p>
            {topValues.map(({v, i: idx}) => (
              <div key={idx} style={{display: "flex", justifyContent: "space-between", padding: "5px 0", borderBottom: `1px solid ${C.borderLight}`}}>
                <span style={{fontSize: 14}}>{t.values[idx]}</span>
                <span style={{fontWeight: 700, color: C.teal}}>{v}/5</span>
              </div>
            ))}
          </div>
        )}
        <PCCard />
        <div className="print-no-break" style={{...sCard, marginBottom: 8, padding: "14px 18px"}}>
          <SRow label={t.summaryReadiness} value={decisionStage !== null ? t.stages[decisionStage] : t.notAnswered} />
        </div>

        {/* ═══ PART 2: Pugh Structured Comparison ═══ */}
        <div className="print-page-break print-keep-next" style={{...sSection, marginTop: 0, borderBottom: `3px solid ${C.teal}`, paddingBottom: 8}}>{t.resultsPart2}</div>
        <div className="print-legend" style={{background: C.tealLight, borderLeft: `4px solid ${C.tealDark}`, borderRadius: 8, padding: "14px 18px", marginBottom: 16}}>
          <p style={{fontSize: 15, fontWeight: 600, color: C.text, lineHeight: 1.55, marginBottom: 12}}>{t.resultsScoringLead}</p>
          {t.resultsLegend.map(([sym, label, desc], li) => (
            <div key={li} style={{display: "flex", gap: 10, alignItems: "flex-start", marginBottom: li < 2 ? 8 : 0}}>
              <span aria-hidden="true" style={{background: li === 0 ? C.posLight : li === 1 ? C.negLight : "#F3F4F6", color: li === 0 ? C.pos : li === 1 ? C.neg : C.textMid, fontWeight: 800, fontSize: 15, minWidth: 34, textAlign: "center", borderRadius: 6, padding: "3px 0", flexShrink: 0}}>{sym}</span>
              <span style={{fontSize: 14, color: C.text, lineHeight: 1.5}}><strong>{label}</strong>{" \u2014 "}{desc}</span>
            </div>
          ))}
          <p style={{fontSize: 13, color: C.textMid, lineHeight: 1.5, marginTop: 12, paddingTop: 10, borderTop: `1px solid ${C.border}`}}>
            {t.resultsScoreRange.replace("{min}", "\u2212" + scoreRangeMax).replace("{max}", "+" + scoreRangeMax)}
          </p>
        </div>

        {bestIdx >= 0 && (
          <div className="print-no-break print-compact" style={{...sCard, background: C.posLight, borderLeft: `4px solid ${C.pos}`, textAlign: "center", padding: 32}}>
            <p style={{fontSize: 14, color: C.textLight, marginBottom: 4}}>{topIdxs.length > 1 ? t.strongestTie : t.strongest}</p>
            {topIdxs.map(i => (
              <p key={i} className="print-strong-name" style={{fontSize: topIdxs.length > 1 ? 22 : 28, fontWeight: 700, color: C.pos, marginBottom: 4}}>{validOpts[i]}</p>
            ))}
            <p className="print-strong-score" style={{fontSize: 36, fontWeight: 800, color: scoreColor(scores[bestIdx] || 0)}}>{scoreLabel(scores[bestIdx] || 0)}</p>
            {topIdxs.length > 1 && <p style={{fontSize: 13, color: C.textMid, lineHeight: 1.5, marginTop: 6}}>{t.tieNote}</p>}
          </div>
        )}

        {tenure !== null && tenure !== 0 && tenure !== 4 && ownerPerm !== null && ownerPerm >= 1 && ownerPerm <= 3 && (
          <div className="print-no-break print-compact-note" style={{...sCard, background: C.goldLight, borderLeft: `4px solid ${C.gold}`, fontSize: 14, color: C.text, lineHeight: 1.5}}>
            {"\u26A0\uFE0F "}{t.permissionNote}
          </div>
        )}

        <div className="print-hide" style={sCard}>
          <p style={{fontWeight: 700, fontSize: 18, marginBottom: 18}}>{t.scoreSummary}</p>
          <div style={{marginBottom: 12, display: "flex", alignItems: "center", gap: 10}}>
            <span style={{width: 180, flexShrink: 0, fontSize: 13, textAlign: "right", color: C.textLight}}>{t.baseline}</span>
            <div style={{flex: 1, height: 2, background: C.border}} />
            <span style={{fontWeight: 700, color: C.textLight, minWidth: 36}}>0</span>
          </div>
          {validOpts.map((opt, i) => {
            const s = scores[i] || 0;
            const bw = Math.abs(s) / maxAbs * maxBar;
            return (
              <div key={i} style={{display: "flex", alignItems: "center", gap: 10, marginBottom: 10}}>
                <span style={{width: 180, flexShrink: 0, fontSize: 13, lineHeight: 1.3, textAlign: "right", fontWeight: topIdxs.includes(i) ? 700 : 400}}>
                  {opt}
                </span>
                <div style={{flex: 1, display: "flex", alignItems: "center", justifyContent: s >= 0 ? "flex-start" : "flex-end", height: 22}}>
                  <div style={{width: bw, height: 18, background: scoreColor(s), borderRadius: 4, transition: "width 0.5s", minWidth: s !== 0 ? 4 : 0}} />
                </div>
                <span style={{fontWeight: 700, minWidth: 36, color: scoreColor(s)}}>
                  {scoreLabel(s)}
                </span>
              </div>
            );
          })}
        </div>

        <div className="print-no-break print-compact" style={sCard}>
          <p style={{fontWeight: 700, fontSize: 18, marginBottom: 14}}>{t.factorBreakdown}</p>
          <div className="print-only" style={{fontSize: 12, color: C.text, lineHeight: 1.5, marginBottom: 8}}>
            {validOpts.map((o, i) => <div key={i}><strong>{t.optionN} {i + 1}:</strong> {o}</div>)}
          </div>
          <div style={{overflowX: "auto"}}>
            <table style={{width: "100%", borderCollapse: "collapse", fontSize: 13}}>
              <thead>
                <tr style={{borderBottom: `2px solid ${C.border}`}}>
                  <th style={{textAlign: "left", padding: "8px 4px"}}>{lang === "en" ? "Factor" : "Facteur"}</th>
                  <th style={{padding: "8px 4px", textAlign: "center", width: 80}}>{t.weight}</th>
                  {validOpts.map((o, i) => (
                    <th key={i} style={{padding: "8px 4px", textAlign: "center"}}>
                      <span className="screen-only">{o}</span>
                      <span className="print-only-inline">{t.optionN} {i + 1}</span>
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {t.factors.map((f, fi) => {
                  const fw = derivedWeights[fi] || 0;
                  return (
                    <tr key={fi} style={{borderBottom: `1px solid ${C.borderLight}`}}>
                      <td style={{padding: "6px 4px", fontSize: 12}}>{f}</td>
                      <td style={{textAlign: "center", fontWeight: 600, color: C.teal}}>{fw}</td>
                      {validOpts.map((_, oi) => {
                        const cv = fw * (ratings[`${oi}-${fi}`] || 0);
                        return (
                          <td key={oi} style={{textAlign: "center", fontWeight: 600, color: cv > 0 ? C.pos : cv < 0 ? C.neg : C.textLight}}>
                            {cv > 0 ? "+" : ""}{cv}
                          </td>
                        );
                      })}
                    </tr>
                  );
                })}
                <tr style={{borderTop: `2px solid ${C.text}`}}>
                  <td style={{padding: "10px 4px", fontWeight: 700}}>{t.total}</td>
                  <td></td>
                  {validOpts.map((_, i) => (
                    <td key={i} style={{textAlign: "center", fontWeight: 700, fontSize: 16, color: scoreColor(scores[i] || 0)}}>
                      {(scores[i] || 0) > 0 ? "+" : ""}{scores[i] || 0}
                    </td>
                  ))}
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        {forTwo && (
          <div className="print-no-break" style={sCard}>
            <p style={{fontWeight: 700, fontSize: 18, marginBottom: 4}}>{t.forTwoTitle}</p>
            <p style={{fontSize: 13, color: C.textLight, marginBottom: 14}}>{t.forTwoResultsDesc}</p>
            <table style={{width: "100%", borderCollapse: "collapse", fontSize: 13}}>
              <thead>
                <tr style={{borderBottom: `2px solid ${C.border}`}}>
                  <th style={{textAlign: "left", padding: "8px 4px"}}>{lang === "en" ? "Value" : "Valeur"}</th>
                  <th style={{textAlign: "center", padding: "8px 4px"}}>{t.person1}</th>
                  <th style={{textAlign: "center", padding: "8px 4px"}}>{t.person2}</th>
                  <th style={{textAlign: "center", padding: "8px 4px"}}></th>
                </tr>
              </thead>
              <tbody>
                {t.values.map((v, vi) => {
                  const diff = Math.abs(vals[vi] - p2Vals[vi]);
                  return (
                    <tr key={vi} style={{borderBottom: `1px solid ${C.borderLight}`}}>
                      <td style={{padding: "6px 4px", fontSize: 12}}>{v}</td>
                      <td style={{textAlign: "center", fontWeight: 600, color: C.teal}}>{vals[vi]}</td>
                      <td style={{textAlign: "center", fontWeight: 600, color: C.goldText}}>{p2Vals[vi]}</td>
                      <td style={{textAlign: "center"}}>
                        <span style={{fontSize: 11, fontWeight: 600,
                          color: diff <= 1 ? C.pos : C.neg,
                          background: diff <= 1 ? C.posLight : C.negLight,
                          padding: "3px 8px", borderRadius: 10}}>
                          {diff <= 1 ? `\u2713 ${t.agree}` : `\u26A1 ${t.disagree}`}
                        </span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}

        {funding && (
          <div className="print-page-break" style={sCard}>
            <p style={{fontWeight: 700, fontSize: 18, marginBottom: 4}}>{t.fundingPreview}</p>
            <p style={{fontSize: 13, color: C.textLight, marginBottom: 16}}>{t.fundingPreviewDesc}</p>
            <FundingGroup heading={`${t.fundingRegional} ${t.provinceFull[PK.indexOf(province)]}`} items={funding} />
            <FundingGroup heading={t.fundingNational} items={FUNDING_CA} compact />
          </div>
        )}

        <div id="print-buttons" style={{display: "flex", gap: 12, marginTop: 24, flexWrap: "wrap"}}>
          <button onClick={() => window.print()} style={sPrimBtn}>
            {"\uD83D\uDDA8\uFE0F "}{t.exportPdf}
          </button>
          <button onClick={() => {
            setStep(0); setUserOptions([""]); setReasonsText(""); setTimeline(null);
            setProvince(null); setDecisionStage(null); setTenure(null); setTenureOther(""); setDisabilities([]);
            setCondition(null); setProgression(null); setIntention(null); setOwnerPerm(null);
            setInvolved([]); setPressure(null); setVals(Array(12).fill(0)); setP2Vals(Array(12).fill(0));
            setSure(Array(4).fill(null)); setP2Sure(Array(4).fill(null));
            setRatings({}); setRateIdx(0); setProsCons({});
          }} style={sSecBtn}>{t.startOver}</button>
        </div>
      </div>
    );
  };

  // Router: 0=Welcome 1=Options 2=Disability 3=Involved 4=Values 5=ProsCons 6=SURE 7=Summary 8=Rate 9=Review 10=Results
  const renderScreen = () => {
    switch (step) {
      case 0: return Welcome();
      case 1: return S1_1();
      case 2: return S1_2();
      case 3: return S1_3();
      case 4: return S1_4();
      case 5: return S2_0();
      case 6: return S1_6();
      case 7: return S2_2();
      case 8: return S2_3();
      case 9: return S2_4();
      default: return Welcome();
    }
  };

  return (
    <div style={{minHeight: "100vh", background: C.bg, fontFamily: "'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',sans-serif", color: C.text}}>
      <div id="app-header" style={{background: C.tealDark, color: C.white, padding: "14px 24px"}}>
        <div style={{maxWidth: 740, margin: "0 auto", display: "flex", justifyContent: "space-between", alignItems: "center"}}>
          <div style={{display: "flex", alignItems: "center", gap: 12}}>
            <div style={{width: 40, height: 40, borderRadius: 8, background: C.white, display: "flex", alignItems: "center", justifyContent: "center", padding: 4, flexShrink: 0}}>
              <img src={HAT_LOGO} alt="" aria-hidden="true" style={{maxWidth: "100%", maxHeight: "100%", display: "block"}}/>
            </div>
            <div>
              <div style={{fontSize: 16, fontWeight: 700, letterSpacing: 0.3, lineHeight: 1.25}}>{t.title}</div>
              <div style={{fontSize: 12, opacity: 0.9, fontWeight: 600}}>{t.subtitle}</div>
            </div>
          </div>
          <button onClick={() => setLang(lang === "en" ? "fr" : "en")}
            style={{background: C.white, border: `1px solid ${C.white}`, color: C.tealDark, padding: "6px 14px", borderRadius: 8, cursor: "pointer", fontSize: 13, fontWeight: 600, fontFamily: "inherit"}}>
            {t.langSwitch}
          </button>
        </div>
      </div>
      <div id="app-main" style={{maxWidth: 740, margin: "0 auto", padding: "28px 18px 100px"}}>
        <Progress />
        {renderScreen()}
      </div>
      <div id="app-footer" style={{background: C.tealDark, color: "rgba(255,255,255,0.6)", padding: "14px 24px", textAlign: "center", fontSize: 11, position: "fixed", bottom: 0, left: 0, right: 0}}>
        {t.tagline} {"\u00B7"} {"\u00A9"} 2026 Home Accessibility Toolkit Decision Aid {"\u00B7"} Sunnybrook Research Institute
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
